server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: medilens-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medilens_db}
    username: ${SPRING_DATASOURCE_USERNAME:medilens_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:change_this_secure_password_in_production}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: MediLensHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:change_this_redis_password_in_production}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# Application-specific security & services configuration
medilens:
  security:
    jwt:
      secret: ${JWT_SECRET:super_secret_jwt_signing_key_must_be_at_least_256_bits_long_for_hs256_alg}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${INTERNAL_API_KEY:internal_pre_shared_key_between_backend_and_ai_service}
  storage:
    reports-dir: ${REPORT_STORAGE_DIR:/var/medilens/reports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
