spring:
  application:
    name: medilens-backend-test

  datasource:
    url: jdbc:h2:mem:medilens_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

medilens:
  security:
    jwt:
      secret: test_super_secret_jwt_signing_key_at_least_256_bits_length_for_hmac_sha256
      expiration-ms: 3600000        # 1 hour
      refresh-expiration-ms: 86400000 # 24 hours
  ai-service:
    url: http://localhost:8000
    api-key: test-internal-key
  storage:
    reports-dir: target/test-reports
  cors:
    allowed-origins: http://localhost:3000
